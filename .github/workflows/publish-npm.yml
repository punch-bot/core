name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on main (for example, v1.4.1)
        required: true
        type: string
      dry_run:
        description: Validate and pack without publishing
        default: true
        type: boolean

permissions: {}

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate release source and versions
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { getPublicWorkspacePackages } from './scripts/release-packages.mjs';

          const version = process.env.RELEASE_TAG.slice(1);
          const packages = getPublicWorkspacePackages();
          if (packages.length === 0) throw new Error('No public workspace packages found');
          for (const pkg of packages) {
            if (pkg.version !== version) throw new Error(`${pkg.name}: expected ${version}, found ${pkg.version}`);
            const changelog = readFileSync(join(pkg.directory, 'CHANGELOG.md'), 'utf8');
            if (!changelog.includes(`## [${version}] - `)) throw new Error(`${pkg.name}: release changelog missing`);
          }
          NODE
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  env-daemons:
    needs: validate
    uses: ./.github/workflows/env-daemons.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.validate.outputs.source_sha }}

  publish:
    needs: [validate, env-daemons]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout validated release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.16.0 --ignore-scripts

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download pi-env daemons
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pi-env-*
          path: packages/env/bin

      - name: Check pi-env daemons
        shell: bash
        run: |
          set -euo pipefail
          for name in linux-x64 linux-arm64 android-arm64 android-x64 darwin-arm64 darwin-x64; do
            test -s "packages/env/bin/pi-env-${name}/pi-env"
          done
          for name in windows-x64 windows-arm64; do
            test -s "packages/env/bin/pi-env-${name}/pi-env.exe"
          done
          chmod +x packages/env/bin/*/pi-env*
          packages/env/bin/pi-env-linux-x64/pi-env --version

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build from the committed model catalog
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Build the pi-env daemon for tests
        run: npm run build:daemon --workspace packages/env

      - name: Test without provider credentials
        run: ./test.sh

      - name: Smoke-test packed npm consumers
        run: npm run check:package-install

      - name: Check source remained unchanged
        run: git diff --exit-code

      - name: Validate npm tarball publication with provenance
        run: node scripts/publish.mjs --dry-run

      - name: Publish npm packages with provenance
        if: ${{ !inputs.dry_run }}
        run: node scripts/publish.mjs
