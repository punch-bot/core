services:
  supervisor:
    image: ${PUNCH_SUPERVISOR_IMAGE:?Set a digest-pinned supervisor image}
    restart: unless-stopped
    stop_grace_period: 125s
    environment:
      PUNCH_SUPERVISOR_DATABASE: /state/supervisor.db
      PUNCH_SUPERVISOR_TOKEN: ${PUNCH_SUPERVISOR_TOKEN:?Set a random control credential}
      PUNCH_RUNTIME_IMAGE: ${PUNCH_RUNTIME_IMAGE:?Set a digest-pinned runtime image}
      PUNCH_DOCKER_NETWORK: ${PUNCH_DOCKER_NETWORK:-punch-sandboxes}
      PUNCH_WORKSPACE_ENVIRONMENTS: /config/workspaces.json
    volumes:
      - supervisor-state:/state
      - type: bind
        source: ${PUNCH_DOCKER_SOCKET_SOURCE:-/var/run/docker.sock}
        target: /var/run/docker.sock
      - type: bind
        source: ${PUNCH_CONFIG_DIRECTORY:?Set the absolute config directory}
        target: /config
        read_only: true
    networks: [sandboxes]
  gateway:
    image: ${PUNCH_GATEWAY_IMAGE:?Set a digest-pinned gateway image}
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on: [supervisor]
    environment:
      PUNCH_GATEWAY_ID: ${PUNCH_GATEWAY_ID:?Set a stable UUID}
      PUNCH_GATEWAY_DATABASE: /state/gateway.db
      PUNCH_SUPERVISOR_URL: http://supervisor:8081
      PUNCH_SUPERVISOR_TOKEN: ${PUNCH_SUPERVISOR_TOKEN}
      PUNCH_MEMBERSHIP_FILE: /config/memberships.json
      PUNCH_OIDC_ISSUER: ${PUNCH_OIDC_ISSUER:?Set the OIDC issuer}
      PUNCH_OIDC_AUDIENCE: ${PUNCH_OIDC_AUDIENCE:?Set the OIDC audience}
      PUNCH_OIDC_JWKS_URL: ${PUNCH_OIDC_JWKS_URL:?Set the HTTPS JWKS URL}
      PUNCH_OIDC_SCOPES: ${PUNCH_OIDC_SCOPES:-punch}
      PUNCH_DISCORD_APPLICATION_ID: ${PUNCH_DISCORD_APPLICATION_ID:-}
      PUNCH_DISCORD_PUBLIC_KEY: ${PUNCH_DISCORD_PUBLIC_KEY:-}
      PUNCH_DISCORD_BOT_TOKEN: ${PUNCH_DISCORD_BOT_TOKEN:-}
    ports: ["127.0.0.1:8082:8082"]
    volumes:
      - gateway-state:/state
      - type: bind
        source: ${PUNCH_CONFIG_DIRECTORY}/memberships.json
        target: /config/memberships.json
        read_only: true
    networks: [sandboxes]
networks:
  sandboxes:
    name: ${PUNCH_DOCKER_NETWORK:-punch-sandboxes}
volumes:
  supervisor-state:
  gateway-state:
